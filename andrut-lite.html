const PROMPT = "You are the AI inside Andrut Lite – a tool in the browser where the user builds a small web app (a \"world\") by talking to you. You create and change the files of the world with tools; the user sees the result in a preview next to the chat.\n\n# The world\n- Plain HTML, CSS and JavaScript files. The entry point is `index.html`. Use relative paths between files (`app.js`, `css/style.css`).\n- There is no server: the preview serves the world files from memory. Scripts, styles, images, `fetch`/XHR of world files and ES modules (`import` with relative paths) work. Server code does not exist.\n- Libraries may be loaded from a CDN with a pinned version (the device must be online).\n- Layout: phone first, must also work on a wide screen. `html, body { margin: 0 }`, a full-height app uses `100dvh`.\n- Theme: `<link rel=\"stylesheet\" href=\"/theme/andrut-theme.css\">` gives CSS variables (`--bg`, `--surface`, `--surface2`, `--primary`, `--on-primary`, `--text`, `--muted`, `--border`, `--radius`) and classes `.card`, `.btn`/`button` (`.secondary`, `.ghost`), `.chip`, `.row`, `.col`, `.container`, `.modal` + `.modal-box` + `.modal-actions`, `.sheet` + `.sheet-box`, `.toast`, `.choice-list`. Use them instead of inventing colours. Pages of a UI library with its own theme (e.g. SAP UI5) do not link it.\n- Never use `alert()`, `confirm()`, `prompt()` – build dialogs as page elements (`.modal`).\n- Data that must survive a reload: `andrut.setData(key, string)`, `andrut.getData(key)` (null when missing), `andrut.removeData(key)`. Also `andrut.log(text)`, `andrut.toast(text)`, `andrut.userName()`.\n- A world that needs a few seconds to start sets `window.andrutLoading = true` at the top of index.html and `false` when the first screen is drawn – check_world waits for it.\n- `window.andrutDescribe = () => \"short state\"` helps you test: look_at_world and interact_world print it.\n\n# How to work\n- If `AGENTS.md` exists, read it first. Keep there the agreements with the user, the file roles and decisions (short, in English); update it when they change.\n- Before the first implementation of a non-trivial request (a new app, a new screen or a larger change), write a short proposal and wait for the user's approval: what you will build, the files, the main decisions, and anything you assume. Write no code before the user agrees. Small fixes and changes the user described exactly need no proposal – just do them.\n- When something is unclear or there are several sensible options, ask with the `ask_user` tool (a question with 2-4 options, each with a short description, the recommended one first) instead of guessing or asking in plain text. Ask about everything unclear at once, not one thing per message.\n- If a skill from the list below fits the task, call use_skill before you start and follow it. Copy its template files with copy_skill_file instead of retyping them.\n- Small changes: edit_file. New or rewritten file: write_file (at most about 8000 characters per call, continue with append_file).\n- After changes run check_world and fix what it reports. Do not say something works unless you checked it (check_world, look_at_world, run_js, interact_world).\n- Answer in the language of the user, briefly: what you did and what the user can try. No code listings in the chat unless asked.";
const SKILLS = {"ui5-freestyle": {"name": "ui5-freestyle", "description": "Freestyle SAP Fiori apps in Andrut worlds with OpenUI5 (sap.m, sap.uxap, sap.f) loaded from the CDN – lists, tables, forms, object pages, dialogs, JSONModel data saved with andrut.setData. Use when the user asks for a SAP UI5 / Fiori / \"SAP look\" app with hand-written screens. For screens generated from OData annotations (List Report, Object Page) use ui5-fiori-elements instead.", "body": "# Freestyle Fiori with OpenUI5\n\nA world can load OpenUI5 from the CDN; the phone must be online. Start from the tested template, do not write the bootstrap from memory.\n\n## Start\n1. `copy_skill_file` `template/index.html` → `index.html` and `template/app.js` → `app.js`.\n2. Rename texts and the data model, then extend. Keep the structure of the template (list page → detail page → edit dialog).\n3. Split code into modules of the `demo` namespace when `app.js` grows: `sap.ui.define([...], function () {...})` in `detail.js` is required as `\"demo/detail\"`.\n\n## Bootstrap rules (the usual causes of a blank or unstyled page)\n- Script URL without a version: `https://sdk.openui5.org/resources/sap-ui-core.js`. A pinned version must be an existing patch – SAP removes old patches from the CDN; then `sap-ui-core.js` may still load while every `library.css` returns 404 and the console says the stylesheet was blocked (ORB). That is a wrong URL, not a blocked WebView. Existing patches: `https://sdk.openui5.org/version.json`.\n- Never fetch theme CSS yourself and never inject it as `<style>` – UI5 loads the theme of every library by itself.\n- `data-sap-ui-resource-roots='{\"demo\": \"./\"}'` and `data-sap-ui-on-init=\"module:demo/app\"`. Never map the empty root `\"\"` – then `sap/*` modules are searched in the world files.\n- `data-sap-ui-async=\"true\"`, `data-sap-ui-compat-version=\"edge\"`, libraries in `data-sap-ui-libs` (`sap.m,sap.uxap,sap.ui.layout`; add `sap.f`, `sap.ui.table`, `sap.ui.unified` only when used).\n- `html, body { height: 100dvh; margin: 0 }`, the root `<div id=\"content\" style=\"height:100%\">`, body class `sapUiBody`. `sap.m.App`/`Page` do the scrolling – no own scroll containers around them.\n\n## Look\n- The Andrut theme does not apply to UI5 controls. Do not link `/theme/andrut-theme.css` in a UI5 page and do not override `.sapM…`/`.sapUi…` classes – the UI5 theme is the design. Themes: `sap_horizon` (light), `sap_horizon_dark`; switch with `sap/ui/core/Theming.setTheme(...)`.\n- Own CSS only for own elements, with own class names; spacing with UI5 margin classes (`sapUiSmallMargin`, `sapUiTinyMarginTop`, `sapUiResponsiveMargin`).\n- Phone first: `sap.m.List` with `ObjectListItem`/`StandardListItem`; `sap.m.Table` only with `demandPopin: true` and `minScreenWidth: \"Tablet\"` on secondary columns; forms as `SimpleForm` with `ResponsiveGridLayout`; many actions → `OverflowToolbar`.\n\n## Windows and choices\n- `sap.m.Dialog`, `MessageBox`, `MessageToast`, `Select`, `ComboBox`, `ActionSheet`, `Popover`, `DatePicker` are page elements – use them. Never `alert()`, `confirm()`, `prompt()` or a native `<select>`.\n- Dialogs: create on demand, `afterClose: function () { dlg.destroy(); }`; edit a copy of the data (`new JSONModel(copy)` as a named model) and write it back on Save.\n\n## Data and navigation\n- `JSONModel` + bindings; formatters as functions (`{ path: \"price\", formatter: fn }`). After changing an array call `model.setProperty(\"/items\", arr)` (or `model.refresh()`).\n- Persist with `andrut.setData(key, JSON.stringify(...))`, read with `andrut.getData(key)`; log important user actions with `andrut.log(\"…\")`; describe the state in `window.andrutDescribe`. Document keys in AGENTS.md.\n- Android \"back\": each detail view is a history entry – `history.pushState` when opening, `popstate` → `app.back()` (see template). The page's nav button calls `history.back()`. With many screens use `sap/m/routing/Router` (hash based) instead – it also works with \"back\".\n- Live data: `fetch()` to public APIs with CORS; put the result into the JSONModel. A real OData service needs CORS for the world's origin.\n\n## API notes (UI5 1.120+)\n- No globals like `sap.ui.getCore()`, `jQuery.sap.*`, `sap.ui.controller` – require modules: `sap/ui/core/Element` (`Element.getElementById`), `sap/ui/core/Theming`, `sap/ui/core/Fragment`, `sap/base/Log`.\n- Controls created in JS (as in the template) need no extra files. XML views/fragments also work (`demo/view/Main.view.xml` → `\"demo.view.Main\"`), each is one more small file.\n- Icons: `sap-icon://name` (e.g. `add`, `edit`, `delete`, `filter`, `search`, `navigation-right-arrow`).\n- OpenUI5 has no smart controls (`sap.ui.comp`), no `sap.viz` charts, no Fiori Elements. For charts use inline SVG or Chart.js; for annotation-driven screens use the ui5-fiori-elements skill (SAPUI5).\n\n## Testing with run_js\nThe template defines helpers that work on UI5 controls (keep them when you rewrite `app.js`):\n- `ui5Test.screen()` – state, open dialogs, message toasts, buttons on screen.\n- `ui5Test.buttons()` – every button with id, text, visible, on screen.\n- `ui5Test.press(\"Save\")` – presses a button by exact text, tooltip or id (also one hidden in a ⋯ overflow menu); `ui5Test.press(\"Laptop Kestrel\")` – presses the list item containing the text.\n- Typical test: `ui5Test.press(\"…\")` → wait 1–2 s (`interact_world` `[{\"wait\":1500}]`) → `ui5Test.screen()` and the saved data (`andrut.getData(\"products\")`).\n- `run_js` waits for a Promise, so `(async () => { … })()` returns its result directly. In `interact_world` prefer `{\"waitFor\":\"selector\"}` or `{\"waitFor\":{\"text\":\"…\"}}` to a fixed `wait`.\n- Do not use `sap.ui.getCore().byId`, `sap.ui.getCore().mElements` or `sap.ui.core.Element.registry` – they do not exist in current UI5.\n- UI5 ids are generated (`__button3`) and change between loads – press by text, not by id; give own stable ids (`new Button(\"saveBtn\", {...})`) to controls you test often.\n- A file picker cannot be operated by your tools: keep the import logic in a function that takes the text and test that function.\n\n## Checking\n- UI5 renders 1–3 s after the page loads. After a change wait before judging: check the console first, then take a screenshot. An empty page right after load is not yet an error.\n- Console: `404 … library.css` or \"ORB\" → wrong CDN version/URL. `failed to load JavaScript resource: demo/...` → wrong module name or missing file. \"Device API logging initialized\" is harmless.\n- The template sets `window.andrutLoading = true` in `index.html` and clears it in `app.js` after the app is placed, so `check_world` waits for UI5. Keep both. If `check_world` says the world \"still reports loading\", the start failed – read the console.\n- Report only what you verified; if you could not take a screenshot, say so.", "files": {"template/app.js": "// Freestyle Fiori starter for Andrut (OpenUI5, controls created in JS – no XML views).\n// List page (search + category filter) -> detail page (ObjectPageLayout) -> edit dialog. Data saved with andrut.setData.\nsap.ui.define([\n  \"sap/m/App\", \"sap/m/Page\", \"sap/m/List\", \"sap/m/ObjectListItem\", \"sap/m/ObjectAttribute\", \"sap/m/ObjectStatus\",\n  \"sap/m/SearchField\", \"sap/m/Select\", \"sap/ui/core/Item\", \"sap/m/Toolbar\", \"sap/m/ToolbarSpacer\", \"sap/m/Button\",\n  \"sap/m/Dialog\", \"sap/m/Label\", \"sap/m/Input\", \"sap/m/StepInput\", \"sap/m/MessageToast\", \"sap/m/MessageBox\", \"sap/m/Text\",\n  \"sap/ui/layout/form/SimpleForm\", \"sap/ui/model/json/JSONModel\", \"sap/ui/model/Filter\", \"sap/ui/model/FilterOperator\",\n  \"sap/uxap/ObjectPageLayout\", \"sap/uxap/ObjectPageHeader\", \"sap/uxap/ObjectPageSection\", \"sap/uxap/ObjectPageSubSection\",\n  \"sap/ui/core/Theming\", \"sap/ui/core/ElementRegistry\"\n], function (App, Page, List, ObjectListItem, ObjectAttribute, ObjectStatus, SearchField, Select, Item, Toolbar, ToolbarSpacer,\n             Button, Dialog, Label, Input, StepInput, MessageToast, MessageBox, Text, SimpleForm, JSONModel, Filter, FilterOperator,\n             ObjectPageLayout, ObjectPageHeader, ObjectPageSection, ObjectPageSubSection, Theming, ElementRegistry) {\n  \"use strict\";\n  var hasAndrut = typeof window.andrut !== \"undefined\";\n  var KEY = \"products\";\n  var CATEGORIES = [\"Computers\", \"Monitors\", \"Accessories\"];\n  var DEFAULT = [\n    { id: \"P-100\", name: \"Laptop Kestrel 14\", category: \"Computers\", price: 4299, stock: 12, supplier: \"Nordtech\" },\n    { id: \"P-101\", name: \"Monitor Vista 27\", category: \"Monitors\", price: 1349, stock: 0, supplier: \"Optiline\" },\n    { id: \"P-102\", name: \"Keyboard Tactile Pro\", category: \"Accessories\", price: 389, stock: 54, supplier: \"Keyworks\" },\n    { id: \"P-103\", name: \"Mouse Glide\", category: \"Accessories\", price: 149, stock: 3, supplier: \"Keyworks\" }\n  ];\n  function load() {\n    try { var s = hasAndrut ? andrut.getData(KEY) : localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch (e) {}\n    return JSON.parse(JSON.stringify(DEFAULT));\n  }\n  function save() {\n    var s = JSON.stringify(model.getProperty(\"/items\"));\n    try { if (hasAndrut) andrut.setData(KEY, s); else localStorage.setItem(KEY, s); } catch (e) {}\n  }\n  function log(t) { try { if (hasAndrut) andrut.log(t); } catch (e) {} }\n  function state(stock) { return stock === 0 ? \"Error\" : stock < 5 ? \"Warning\" : \"Success\"; }\n  function stateText(stock) { return (stock === 0 ? \"Out of stock\" : stock < 5 ? \"Low\" : \"Available\") + \" (\" + stock + \")\"; }\n  function price(p) { return new Intl.NumberFormat(\"en-US\", { style: \"currency\", currency: \"EUR\" }).format(p || 0); }\n  function categoryItems(withAll) {\n    return (withAll ? [new Item({ key: \"\", text: \"All\" })] : []).concat(CATEGORIES.map(function (c) { return new Item({ key: c, text: c }); }));\n  }\n\n  var model = new JSONModel({ items: load(), dark: false });\n\n  // ---- list page ----\n  var query = \"\", category = \"\";\n  var list = new List({ growing: true, growingThreshold: 20, noDataText: \"No items\" });\n  function applyFilters() {\n    var f = [];\n    if (query) f.push(new Filter(\"name\", FilterOperator.Contains, query));\n    if (category) f.push(new Filter(\"category\", FilterOperator.EQ, category));\n    list.getBinding(\"items\").filter(f.length ? new Filter({ filters: f, and: true }) : []);\n  }\n  list.bindItems({\n    path: \"/items\",\n    template: new ObjectListItem({\n      title: \"{name}\", type: \"Navigation\",\n      number: { path: \"price\", formatter: price },\n      attributes: [new ObjectAttribute({ text: \"{category} · {id}\" })],\n      firstStatus: new ObjectStatus({ text: { path: \"stock\", formatter: stateText }, state: { path: \"stock\", formatter: state } }),\n      press: function (e) { openDetail(e.getSource().getBindingContext().getPath()); }\n    })\n  });\n  var listPage = new Page({\n    title: \"Products\",\n    subHeader: new Toolbar({ content: [\n      new SearchField({ width: \"100%\", placeholder: \"Search\", liveChange: function (e) { query = e.getParameter(\"newValue\"); applyFilters(); } })\n    ] }),\n    content: [\n      new Toolbar({ content: [\n        new Label({ text: \"Category:\" }),\n        new Select({ width: \"10rem\", items: categoryItems(true), change: function (e) { category = e.getParameter(\"selectedItem\").getKey(); applyFilters(); } }),\n        new ToolbarSpacer()\n      ] }),\n      list\n    ],\n    headerContent: [\n      new Button({ icon: \"sap-icon://add\", tooltip: \"Add\", press: function () { openEdit(null); } }),\n      new Button({ icon: \"sap-icon://light-mode\", tooltip: \"Light / dark\", press: toggleTheme })\n    ]\n  });\n\n  // ---- detail page (ObjectPageLayout) ----\n  var currentPath = null;\n  var detailPage = new Page({\n    title: \"Details\", showNavButton: true, navButtonPress: function () { history.back(); }, enableScrolling: false,\n    content: [new ObjectPageLayout({\n      headerTitle: new ObjectPageHeader({\n        objectTitle: \"{name}\", objectSubtitle: \"{category} · {id}\",\n        actions: [\n          new Button({ text: \"Edit\", type: \"Emphasized\", press: function () { openEdit(currentPath); } }),\n          new Button({ text: \"Delete\", type: \"Reject\", press: confirmDelete })\n        ]\n      }),\n      sections: [\n        new ObjectPageSection({ title: \"Information\", subSections: [new ObjectPageSubSection({ blocks: [\n          new SimpleForm({ editable: false, layout: \"ResponsiveGridLayout\", content: [\n            new Label({ text: \"Price\" }), new Text({ text: { path: \"price\", formatter: price } }),\n            new Label({ text: \"Stock\" }), new ObjectStatus({ text: { path: \"stock\", formatter: stateText }, state: { path: \"stock\", formatter: state } }),\n            new Label({ text: \"Supplier\" }), new Text({ text: \"{supplier}\" })\n          ] })\n        ] })] })\n      ]\n    })]\n  });\n\n  var app = new App({ pages: [listPage, detailPage] });\n  app.setModel(model);\n\n  // Navigation: every detail view is a history entry, so the Android \"back\" gesture returns to the list.\n  function openDetail(path, fromHistory) {\n    currentPath = path;\n    detailPage.bindElement(path);\n    app.to(detailPage);\n    if (!fromHistory) history.pushState({ detail: path }, \"\");\n    log(\"opened: \" + model.getProperty(path + \"/name\"));\n  }\n  window.addEventListener(\"popstate\", function (e) {\n    if (e.state && e.state.detail) openDetail(e.state.detail, true);\n    else if (app.getCurrentPage() === detailPage) app.back();\n  });\n\n  // ---- add / edit dialog (works on a copy, written back on Save) ----\n  function openEdit(path) {\n    var src = path ? model.getProperty(path) : { id: \"P-\" + Date.now().toString(36).toUpperCase(), name: \"\", category: CATEGORIES[0], price: 0, stock: 0, supplier: \"\" };\n    var draft = new JSONModel(JSON.parse(JSON.stringify(src)));\n    var dlg = new Dialog({\n      title: path ? \"Edit product\" : \"New product\", contentWidth: \"22rem\",\n      content: [new SimpleForm({ editable: true, layout: \"ResponsiveGridLayout\", content: [\n        new Label({ text: \"Name\", required: true }), new Input({ value: \"{d>/name}\" }),\n        new Label({ text: \"Category\" }), new Select({ selectedKey: \"{d>/category}\", items: categoryItems(false) }),\n        new Label({ text: \"Price\" }), new StepInput({ value: \"{d>/price}\", min: 0, step: 10 }),\n        new Label({ text: \"Stock\" }), new StepInput({ value: \"{d>/stock}\", min: 0 }),\n        new Label({ text: \"Supplier\" }), new Input({ value: \"{d>/supplier}\" })\n      ] })],\n      beginButton: new Button({ text: \"Save\", type: \"Emphasized\", press: function () {\n        var d = draft.getData();\n        if (!d.name.trim()) { MessageToast.show(\"Enter a name\"); return; }\n        if (path) model.setProperty(path, d);\n        else { var arr = model.getProperty(\"/items\"); arr.push(d); model.setProperty(\"/items\", arr); }\n        save(); dlg.close(); MessageToast.show(\"Saved: \" + d.name); log(\"saved: \" + d.name);\n      } }),\n      endButton: new Button({ text: \"Cancel\", press: function () { dlg.close(); } }),\n      afterClose: function () { dlg.destroy(); }\n    });\n    dlg.setModel(draft, \"d\");\n    dlg.open();\n  }\n  function confirmDelete() {\n    var p = model.getProperty(currentPath);\n    MessageBox.confirm(\"Delete \\\"\" + p.name + \"\\\"?\", { title: \"Delete\", actions: [\"Delete\", MessageBox.Action.CANCEL], emphasizedAction: \"Delete\",\n      onClose: function (a) {\n        if (a !== \"Delete\") return;\n        model.setProperty(\"/items\", model.getProperty(\"/items\").filter(function (x) { return x.id !== p.id; }));\n        save(); history.back(); MessageToast.show(\"Deleted\"); log(\"deleted: \" + p.name);\n      } });\n  }\n  function toggleTheme() {\n    var dark = !model.getProperty(\"/dark\"); model.setProperty(\"/dark\", dark);\n    Theming.setTheme(dark ? \"sap_horizon_dark\" : \"sap_horizon\");\n  }\n\n  // State for the AI (check_world / look_at_world read it).\n  window.andrutDescribe = function () {\n    return \"OpenUI5 \" + sap.ui.version + \", \" + model.getProperty(\"/items\").length + \" items, screen: \" +\n      (app.getCurrentPage() === detailPage ? \"details of \" + (currentPath && model.getProperty(currentPath + \"/name\")) : \"list\") +\n      \", theme: \" + Theming.getTheme();\n  };\n\n  // ---- Helpers for testing with run_js (they work on UI5 controls, so also on buttons hidden in an overflow menu) ----\n  function label(c) {\n    try { return (c.getText && c.getText()) || (c.getTitle && c.getTitle()) || (c.getTooltip_AsString && c.getTooltip_AsString()) || \"\"; }\n    catch (e) { return \"\"; }\n  }\n  function controls(test) { var out = []; ElementRegistry.forEach(function (c) { if (test(c)) out.push(c); }); return out; }\n  function unique(list) { return list.filter(function (x, i) { return x && list.indexOf(x) === i; }); }\n  function onScreen(c) { return !!(c.getDomRef() && c.getDomRef().offsetParent); }\n  function isButton(c) { return typeof c.firePress === \"function\" && c.isA(\"sap.m.Button\"); }\n  window.ui5Test = {\n    // every button: \"id | text | visible | on screen\"\n    buttons: function () {\n      return controls(isButton).map(function (c) { return c.getId() + \" | \" + label(c) + \" | visible=\" + c.getVisible() + \" | onScreen=\" + onScreen(c); });\n    },\n    // presses a button (exact text, tooltip or id) or a list item (text it contains)\n    press: function (what) {\n      var found = controls(function (c) { return isButton(c) && c.getVisible() && (c.getId() === what || label(c) === what); });\n      if (!found.length) {\n        found = controls(function (c) { return c.isA(\"sap.m.ListItemBase\") && typeof c.firePress === \"function\" && onScreen(c) && c.getDomRef().innerText.indexOf(what) >= 0; });\n      }\n      if (!found.length) return \"nothing to press for \\\"\" + what + \"\\\". Visible buttons: \" + unique(controls(function (c) { return isButton(c) && c.getVisible(); }).map(label)).slice(0, 40).join(\", \");\n      found[0].firePress();\n      return \"pressed \" + found[0].getMetadata().getName() + \" \" + (label(found[0]) || found[0].getId());\n    },\n    // open dialogs, message toasts and buttons on screen\n    screen: function () {\n      var texts = function (sel) { return Array.prototype.map.call(document.querySelectorAll(sel), function (e) { return e.innerText.replace(/\\s+/g, \" \").trim().slice(0, 200); }); };\n      return JSON.stringify({ state: window.andrutDescribe(), dialogs: texts(\".sapMDialog\"), toasts: texts(\".sapMMessageToast\"),\n        buttonsOnScreen: unique(controls(function (c) { return isButton(c) && onScreen(c); }).map(label)) });\n    }\n  };\n\n  document.getElementById(\"loading\").remove();\n  app.placeAt(\"content\");\n  // The start is over: Andrut's check_world waits for this signal (set in index.html) before judging the screen.\n  setTimeout(function () { window.andrutLoading = false; }, 300);\n});\n", "template/index.html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>UI5 app<\/title>\n<style>html, body { margin: 0; height: 100dvh; } #loading { font: 15px system-ui, sans-serif; padding: 24px; color: #556; }<\/style>\n<script>window.andrutLoading = true; // check_world waits until the app clears it<\/script>\n<script id=\"sap-ui-bootstrap\"\n  src=\"https://sdk.openui5.org/resources/sap-ui-core.js\"\n  data-sap-ui-theme=\"sap_horizon\"\n  data-sap-ui-libs=\"sap.m,sap.uxap,sap.ui.layout\"\n  data-sap-ui-language=\"en\"\n  data-sap-ui-compat-version=\"edge\"\n  data-sap-ui-async=\"true\"\n  data-sap-ui-on-init=\"module:demo/app\"\n  data-sap-ui-resource-roots='{\"demo\": \"./\"}'><\/script>\n<\/head>\n<body class=\"sapUiBody\">\n<div id=\"loading\">Loading OpenUI5…<\/div>\n<div id=\"content\" style=\"height:100%\"><\/div>\n<\/body>\n<\/html>\n"}}, "ui5-fiori-elements": {"name": "ui5-fiori-elements", "description": "SAP Fiori Elements apps in Andrut worlds – List Report and Object Page generated from OData metadata and UI annotations (SAPUI5 from the CDN, OData V2, MockServer in the browser instead of a backend, data kept with andrut.setData). Use when the user asks for Fiori Elements, a List Report / Object Page, or an S/4HANA-style standard app. Covers documents with item tables, dictionaries and value helps (customer, material, type, currency, unit). For hand-written screens use ui5-freestyle instead.", "body": "# Fiori Elements (V2) in an Andrut world\n\nFiori Elements builds the screens itself from three inputs: `metadata.xml` (entities), `annotations.xml` (what to show where) and `manifest.json` (pages). You write no views and no controllers. In Andrut there is no SAP backend and no Fiori Launchpad, so the template replaces them: `MockServer` answers OData V2 in the browser, a stub replaces the launchpad service. The phone must be online (SAPUI5 comes from `ui5.sap.com`; its use is subject to SAP's licence terms).\n\nOnly this setup is tested: **OData V2 + `sap.suite.ui.generic.template` + MockServer**. Fiori Elements for OData V4 (`sap.fe`) exists only in SAPUI5 and has no in-browser mock server – do not try it without a real V4 service that allows CORS.\n\n## Data model rules – decide the entities BEFORE writing any file\nThese are the mistakes that make an app useless as a business app. Apply all three, also when the user did not ask for them.\n\n1. **A document has a header AND items.** Order, invoice, delivery, request, claim, report with lines: the header is one entity type, every line is a row of a SEPARATE entity type with its own key and the header key, shown as a table on the object page (see \"Child table\"). Never put item fields into the header (`Item1Material`, `Material`, `Quantity` next to `Customer`), never model \"one item\" as part of the header, never store items as text or JSON in one field. Even when the user describes one line, model the table – a document gets a second line sooner or later.\n2. **Every coded field has a dictionary and a value help.** A field whose value comes from a known set – customer, supplier, vendor, partner, material, product, type, kind, category, status, organisation, plant, company code, cost centre, country, employee, **currency**, **unit of measure** – is never free text. For each one create: a dictionary entity type + entity set, a `mockdata/<Set>.json` with realistic rows, a `Common.ValueList` on the field, and a `Common.Text` so the name is shown next to the code (see \"Dictionaries and value helps\"). Free text is only for what the user really types: names of new things, descriptions, notes, document numbers.\n3. **Amounts carry a currency, quantities carry a unit.** `Price` + `Currency`, `Quantity` + `Unit`, each pair linked with `sap:unit`; currency and unit both have a dictionary and a value help like any other coded field.\n\nBefore you finish, go through the checklist in \"Checking\".\n\n## Start – copy the whole template, then adapt\n`copy_skill_file` each file to the same path in the world:\n- `template/index.html` → `index.html`\n- `template/fe/start.js`, `template/fe/Component.js`, `template/fe/manifest.json`\n- `template/fe/localService/metadata.xml`, `template/fe/localService/annotations.xml`, `template/fe/localService/mockdata/Products.json`, `Orders.json`, and the dictionaries `Categories.json`, `Suppliers.json`, `Customers.json`, `Currencies.json`, `Units.json` (same folder)\n- `template/fe/i18n/i18n.properties`, `template/fe/changes/changes-bundle.json`, `template/fe/changes/flexibility-bundle.json`\n\nThe template is a complete, tested example: products (list report → object page) with a child table of orders (→ order page), create / edit / delete on both levels, and five dictionaries with value helps: category and currency of the product and unit of the order as dropdowns, supplier and customer as value help dialogs, names shown next to the codes. Check that it works before changing anything. Then change in this order and check after each step:\n1. `metadata.xml` – entity types, properties (`sap:label` = field label), entity sets.\n2. `mockdata/<EntitySet>.json` – array of rows, one file per entity set, file name = entity set name.\n3. `annotations.xml` – columns, filters, object page.\n4. `manifest.json` – `entitySet` / `navigationProperty` of the pages, title; `fe/start.js` – only `SERVICE_URI` (entity sets are read from metadata.xml).\n\nRename and reshape the template to the user's objects (header → items, their dictionaries); keep the pattern. No child table needed (a plain master-data list) → remove the `Order` entity type, the association, the navigation property, the child entity set and association set, the `Orders` facet, the `Order` annotations, the nested page in the manifest and `mockdata/Orders.json`.\n\n## Do not remove (each line fixes a real failure)\n- `index.html`: the `window.andrutLoading = true` script (Andrut's world check waits for the app instead of reporting an empty screen), `data-sap-ui-log-level=\"fatal\"` (UI5 otherwise logs harmless \"no launchpad\" errors), `data-sap-ui-xx-component-preload=\"off\"` (no 404 for Component-preload.js), `data-sap-ui-flexibility-services` with `SessionStorageConnector` (no calls to a backend for variants), resource root `{\"demo\": \"./\"}` (never map `\"\"`).\n- `fe/start.js`: the `ShellUIService` stub – without it the app throws on start; MockServer must be started before `Component.create`; `normalize()` – MockServer answers 404 for a whole table when one row lacks a selected property (a row created in the app has no empty fields), so every row gets all properties; saving without an entity set filter – a child row created through a navigation property is reported under the parent set.\n- `fe/changes/*.json`: empty flex files – without them 404 errors.\n- Script URL with the long-term version as `major.minor` only: `https://ui5.sap.com/1.148/resources/sap-ui-core.js` (SAP serves the newest patch of 1.148 there). Do not use the unversioned URL: it gives the newest release, and 1.154.0 has a bug on phones – the `…` overflow menu of every toolbar throws `Cannot read properties of null (reading 'getBoundingClientRect')` and never opens, so Delete, Settings and own actions are unreachable. Do not pin a full patch (`1.148.3`): SAP removes old patches, and a removed patch gives 404 for `library.css` (\"ORB\" in the console) and an unstyled page. Never fetch or inject theme CSS yourself.\n- Do not link the Andrut theme and do not restyle UI5 classes; themes are `sap_horizon` / `sap_horizon_dark`.\n\n## metadata.xml (OData V2 EDMX)\n- Namespace and service name must match everywhere: schema `Namespace`, `Target` in annotations (`<Namespace>.<EntityType>`), `SERVICE_URI` in start.js = `sap.app/dataSources/mainService/uri` in the manifest.\n- Types: `Edm.String` (MaxLength), `Edm.Int32`, `Edm.Decimal` (Precision, Scale), `Edm.Boolean`, `Edm.DateTime` with `sap:display-format=\"Date\"`, `Edm.Byte` for criticality.\n- Amount with currency: `sap:unit=\"Currency\"` on the amount, `sap:semantics=\"currency-code\"` on the currency property. Quantity: `sap:unit=\"Unit\"` on the quantity, `sap:semantics=\"unit-of-measure\"` on the unit property. Both the currency and the unit property get a value help (below). The pair is shown and edited as one field – put only the amount / quantity into `UI.LineItem` and `UI.FieldGroup`.\n- `sap:filterable=\"false\"`, `sap:sortable=\"false\"` on properties; on the entity set `sap:creatable=\"false\" sap:updatable=\"false\" sap:deletable=\"false\"` make the app read-only. Without them the app gets Create, Edit and Delete.\n\n## Child table (header → items), as in the template: Product → Orders\nAll four parts are needed; names must match exactly:\n1. `metadata.xml`: child entity type with its own key **and the parent key as a property** (`ProductID`); `<NavigationProperty Name=\"to_Orders\" Relationship=\"NS.Product_Orders\" FromRole=\"Product\" ToRole=\"Order\"/>` on the parent; an `<Association>` with both ends (`Multiplicity=\"1\"` / `\"*\"`) and a `<ReferentialConstraint>` (Principal = parent key, Dependent = same property in the child); the child `<EntitySet>` and an `<AssociationSet>` in the container.\n2. `mockdata/Orders.json`: each child row carries the parent key. MockServer filters `Products('P-100')/to_Orders` by the referential constraint.\n3. `annotations.xml`: a facet on the parent with `<PropertyValue Property=\"Target\" AnnotationPath=\"to_Orders/@UI.LineItem\"/>`; for the child type its own `UI.LineItem` (table columns), `UI.HeaderInfo`, `UI.Facets` + `UI.FieldGroup` (its object page).\n4. `manifest.json`: inside the parent's object page `\"pages\": { \"ObjectPage|to_Orders\": { \"navigationProperty\": \"to_Orders\", \"entitySet\": \"Orders\", \"component\": { \"name\": \"sap.suite.ui.generic.template.ObjectPage\" } } }`.\n\nTested behaviour: the table shows only the rows of the opened parent; a row opens the child page; Create in the table opens an empty child page and Save stores the row with the parent key filled in automatically; Edit and Delete work; \"back\" returns to the parent with the table refreshed. On a phone the table shows the `Importance High` columns, the rest as pop-in lines.\nA third level (nested page inside the child's page) follows the same pattern but is untested.\n\n## Create, edit, delete (tested on the list report, the object page and the child table)\n- A field can be entered only if it is in a `UI.FieldGroup` of the object page. Put the key and every required field there – a field shown only in `UI.HeaderInfo` or `UI.LineItem` stays empty on Create.\n- If the key is not on the form, MockServer invents one (e.g. \"OrderID 110\").\n- Read-only app or entity: `sap:creatable=\"false\" sap:updatable=\"false\" sap:deletable=\"false\"` on the entity set; read-only field: `sap:updatable=\"false\"` on the property.\n\n## Own buttons (custom actions) – tested\nA button = an entry in the manifest + a function of the same name in a controller extension (a module returning a plain object of handlers). Both go under `sap.ui5` → `extends` → `extensions` → `sap.ui.controllerExtensions` in `fe/manifest.json`. **The shape differs between the two pages – a wrong shape gives no error and no button.**\n\nList report (table toolbar) – `Actions` directly under the entity set:\n```json\n\"sap.suite.ui.generic.template.ListReport.view.ListReport\": {\n  \"controllerName\": \"demo.fe.ext.ListReportExt\",\n  \"sap.ui.generic.app\": { \"Products\": { \"EntitySet\": \"Products\", \"Actions\": {\n    \"ImportCsv\": { \"id\": \"ImportCsvButton\", \"text\": \"Import CSV\", \"press\": \"onImportCsv\", \"requiresSelection\": false }\n  } } }\n}\n```\nObject page – `Actions` inside **`Header`**:\n```json\n\"sap.suite.ui.generic.template.ObjectPage.view.Details\": {\n  \"controllerName\": \"demo.fe.ext.ObjectPageExt\",\n  \"sap.ui.generic.app\": { \"Products\": { \"EntitySet\": \"Products\", \"Header\": { \"Actions\": {\n    \"Restock\": { \"id\": \"RestockButton\", \"text\": \"Restock\", \"press\": \"onRestock\", \"determining\": true }\n  } } } }\n}\n```\n- `\"determining\": true` puts the object page button into the footer bar, always visible – use it for the main actions (Process, Approve…). Without it the button is a header action, and on a phone header actions sit in the header's ⋯ menu.\n- List report on a phone: only the first custom action fits into the table toolbar, the others are in the toolbar's ⋯ menu. That is normal – do not reorder or rebuild to \"fix\" it; put the most important action first.\n- One `controllerName` per page type; all handlers of that page go into this one file. `fe/ext/Name.controller.js` ↔ `demo.fe.ext.Name`.\n- In a handler: `this.extensionAPI.refreshTable()` (list report), `this.extensionAPI.refresh()` (object page), `this.extensionAPI.getSelectedContexts()`; the opened object on an object page: `this.getView().getBindingContext().getObject()`. Change data with `importRows(...)`, then refresh. Messages with `sap/m/MessageToast` / `MessageBox`.\n- `getObject()` is the model's copy, not mock data: dates are `Date` objects and navigation properties are `{\"__ref\": \"…\"}`. `importRows` converts both (dates → `\"/Date(ms)/\"`, navigation values → MockServer's own), so pass the copy to `importRows` and nowhere else. Never save rows with `andrut.setData` or `setEntitySetData` yourself, and never compare or parse dates as text (`obj.DocumentDate.match(...)` throws on a `Date`) – use `new Date(v).getTime()`.\n- Only methods Fiori Elements V2 really calls run in an extension: the `press` handlers from the manifest, `onInit`, and the hooks `beforeSaveExtension` (object page, before Save – return nothing or a Promise; a rejected Promise stops the save), `beforeDeleteExtension`, `beforeLineItemDeleteExtension`, `onBeforeRebindTableExtension` (list report, add filters to `oEvent.getParameter(\"bindingParams\")`), `onListNavigationExtension`. A method with another name (`onBeforeSave`, `onAfterSave`, `onBeforeCreate`…) is never called – nothing tells you, it just does not happen. Automatic numbers and defaults of a new object: fill them in `beforeSaveExtension` on the binding context (`ctx.getModel().setProperty(ctx.getPath() + \"/DocumentNumber\", \"FV/2025/0007\")`), so they are sent with the Save.\n- Ready files: `extras/ListReportExt.controller.js` (Import CSV), `extras/ObjectPageExt.controller.js` (object page action that changes the opened row). `copy_skill_file` them to `fe/ext/` and adapt.\n- After editing the manifest reload the world; a button that is still missing → check the shape above with `ui5Test.find(\"YourButtonId\")` (empty list = not created = wrong manifest shape or entity set name).\n\n## Own data import (CSV, pasted JSON, fetched data) – no other skill needed\nReading a file and parsing CSV is plain JavaScript (`<input type=\"file\">` + `FileReader`); UI5 is not involved. `start.js` gives:\n- `window.importRows(\"Products\", rows, replaceAll)` – adds rows to an entity set (same key = row replaced; `replaceAll` true = old rows dropped), saves them and returns the new row count. Rows are plain objects with the property names from metadata; missing properties and `__metadata` are filled in.\n- `window.entitySetInfo(\"Products\")` – `{ props, types, keys, type }` from metadata.xml, to convert CSV text by Edm type (Decimal → string with a dot, Int32 → number, DateTime → `\"/Date(ms)/\"`).\n- `window.getRows(\"Products\")` – the current rows.\n\n## Empty list or table although `getRows` shows rows\nThe console line `Fake XHR onreadystatechange handler threw exception: Cannot read properties of undefined (reading 'body')` (from `sinon.js`) means MockServer crashed on a request – almost always a bad row in the saved data, not the manifest, the SmartTable or `loadDataOnAppLaunch`. Do not change the app because of it. Look at `getRows(\"<Set>\")`: dates must be `\"/Date(ms)/\"` (not `\"2025-01-01T00:00:00.000Z\"` or `{}`), no field may hold an object other than `{\"__deferred\": …}`, Decimal as text. The template's `start.js` repairs such rows on every start and in `importRows` – if a world was built with an older `start.js`, `copy_skill_file` `template/fe/start.js` again (keep `SERVICE_URI`) and reload. Fastest way back to clean data: `run_js` `resetMockData()`, then reload the world (rows changed in the app are lost).\n\n\"Import CSV\" button: `copy_skill_file` `extras/ListReportExt.controller.js` → `fe/ext/ListReportExt.controller.js`, set `SET`, add the list report action from the section above. The CSV header line = property names, separator `,` or `;`, quotes supported (`extras/sample.csv` fits the template). The file picker cannot be operated by your tools – test the import with `run_js`: `importCsvText(\"ProductID;Name\\nT-1;Test\")`, then `getRows(\"Products\")`.\n\n## mockdata\n- Keys unique; `Edm.Decimal` as string `\"1349.00\"`, `Edm.Int32` as number, `Edm.DateTime` as `\"/Date(1767225600000)/\"`, booleans `true/false`.\n- Property names exactly as in metadata. Missing file → MockServer generates dummy rows (`bGenerateMissingMockData`).\n- `start.js` saves every entity set after each change with `andrut.setData(\"fe_<EntitySet>\", …)` and restores it on start (tested). After you change `mockdata/*.json` the saved rows still win – reset them with `run_js`: `resetMockData()`, then reload the world. Document the keys in AGENTS.md.\n\n## annotations.xml – what controls what\nAll inside `<Annotations Target=\"<Namespace>.<EntityType>\">`:\n- `UI.LineItem` – table columns (`UI.DataField` with `Value Path`). On a phone only columns with `<Annotation Term=\"UI.Importance\" EnumMember=\"UI.ImportanceType/High\"/>` stay visible. Status colour: `<PropertyValue Property=\"Criticality\" Path=\"…\"/>` (0 neutral, 1 red, 2 orange, 3 green).\n- `UI.SelectionFields` – filter bar fields (`PropertyPath`).\n- `UI.HeaderInfo` – `TypeName`, `TypeNamePlural`, `Title`, `Description` of the object page.\n- `UI.HeaderFacets` → `UI.DataPoint#Qualifier` – key figures in the object page header.\n- `UI.Facets` – sections: `UI.ReferenceFacet` with `Label`, `ID`, `Target AnnotationPath=\"@UI.FieldGroup#Qualifier\"`; `UI.FieldGroup` holds the `UI.DataField`s. `UI.CollectionFacet` groups several reference facets in one section.\n- `UI.PresentationVariant` with `SortOrder` – default sorting; `UI.SelectionVariant` – default filters.\n- Value helps and texts of coded fields: see \"Dictionaries and value helps\".\n- Labels come from `sap:label` in metadata or `Common.Label`; texts in annotations are plain strings in the project language.\n\n## Dictionaries and value helps (tested in the template)\nFor every coded field (rule 2), four pieces – copy them from the template (`Category`, `Supplier`, `Currency` of `Product`; `Customer`, `Unit` of `Order`):\n1. `metadata.xml` – a dictionary entity type with the code as key and a `Name` (plus columns worth searching: city, country, group…), and its entity set with `sap:creatable=\"false\" sap:updatable=\"false\" sap:deletable=\"false\"`. The field in the business entity stores only the code (`Edm.String`, same length as the dictionary key).\n2. `mockdata/<DictionarySet>.json` – realistic rows; every code used in the business mock data must exist in the dictionary.\n3. Name next to the code: an association from the business entity to the dictionary (business entity `*`, dictionary `0..1`, `ReferentialConstraint` with the dictionary key as `Principal` and the code field as `Dependent`), its `AssociationSet`, a `NavigationProperty` (`to_Supplier`), and on the field\n   `<Annotation Term=\"Common.Text\" Path=\"to_Supplier/Name\"><Annotation Term=\"UI.TextArrangement\" EnumMember=\"UI.TextArrangementType/TextFirst\"/><\/Annotation>` → \"Nordtech (S-01)\" in tables, on the page and in edit mode (`TextOnly` hides the code). Titles and descriptions may use the path directly: `<PropertyValue Property=\"Value\" Path=\"to_Category/Name\"/>`. Currency and unit need no text – the code is the text.\n4. Value help: on the field, target `<Namespace>.<EntityType>/<Property>`:\n```xml\n<Annotations Target=\"NS.Product/Supplier\">\n  <Annotation Term=\"Common.Text\" Path=\"to_Supplier/Name\"><Annotation Term=\"UI.TextArrangement\" EnumMember=\"UI.TextArrangementType/TextFirst\"/><\/Annotation>\n  <Annotation Term=\"Common.ValueList\">\n    <Record Type=\"Common.ValueListType\">\n      <PropertyValue Property=\"Label\" String=\"Suppliers\"/>\n      <PropertyValue Property=\"CollectionPath\" String=\"Suppliers\"/>\n      <PropertyValue Property=\"SearchSupported\" Bool=\"false\"/>\n      <PropertyValue Property=\"Parameters\"><Collection>\n        <Record Type=\"Common.ValueListParameterInOut\"><PropertyValue Property=\"LocalDataProperty\" PropertyPath=\"Supplier\"/><PropertyValue Property=\"ValueListProperty\" String=\"SupplierID\"/><\/Record>\n        <Record Type=\"Common.ValueListParameterDisplayOnly\"><PropertyValue Property=\"ValueListProperty\" String=\"Name\"/><\/Record>\n        <Record Type=\"Common.ValueListParameterDisplayOnly\"><PropertyValue Property=\"ValueListProperty\" String=\"City\"/><\/Record>\n      <\/Collection><\/PropertyValue>\n    <\/Record>\n  <\/Annotation>\n<\/Annotations>\n```\n   plus `Common.Text Path=\"Name\"` on the dictionary key (`NS.Supplier/SupplierID`) so the help shows names.\n- **Which kind:** a short, stable list (type, kind, category, status, currency, unit – up to about 20 rows) → add `<Annotation Term=\"Common.ValueListWithFixedValues\" Bool=\"true\"/>` next to `Common.ValueList`: the field becomes a dropdown. A long list (customer, supplier, material, organisation, employee) → no such annotation: the field gets the value help dialog with a filter per `ValueListProperty` and a result table. Give dialogs 2–3 `DisplayOnly` columns people search by.\n- `SearchSupported` must be `false` – MockServer has no free-text search; the filters of the dialog work.\n- The same value help appears in the filter bar when the field is in `UI.SelectionFields` (dropdown → multi-select, dialog → input with help) – put the important coded fields there.\n- The annotation file needs the Common vocabulary reference (`com.sap.vocabularies.Common.v1`, alias `Common`) – it is in the template.\n- After Create, SAPUI5 itself may throw `Cannot read properties of null (reading 'getPath')` from `sap/ui/comp` for fields with `Common.Text` over a navigation property. The object is created and the name is shown – it is a late lookup inside SAPUI5, not your bug. If this line appears in the console right after a Create, ignore it; do not remove the texts or the value helps because of it.\n- Tested: dropdown and dialog open and list the dictionary, a filter in the dialog narrows the rows, the choice is written to the field and saved, the name is shown after saving; on the object page of the child too. In an editable table the unit shows as an input with help, not a dropdown.\n- Imported rows (`importRows`, CSV) carry codes, not names.\n\n## manifest.json\n- `sap.ui.generic.app/pages`: `ListReport|<EntitySet>` with nested `ObjectPage|<EntitySet>`; both need `entitySet`.\n- List report settings: `dataLoadSettings.loadDataOnAppLaunch: \"always\"` (rows without pressing Go), `tableSettings.type: \"ResponsiveTable\"` (right for phones), `smartVariantManagement`.\n- Do not add `flexibleColumnLayout: false` to `settings` – it must be an object or absent (boolean crashes the start).\n- Own buttons through a controller extension – see \"Own buttons\". Custom sections and custom columns are untested; prefer annotations.\n\n## What cannot work in Andrut\n- No launchpad: no cross-app navigation, no intent links, no user settings; \"Share\" has little to offer.\n- No draft handling (needs a backend) – edits are saved directly.\n- Variants and table personalisation live only for the session.\n- The Android \"back\" gesture works (hash navigation) and leaves the world from the list report.\n\n## Testing with run_js (use these, do not guess UI5 internals)\n`start.js` defines helpers that work on UI5 controls, so they also reach buttons hidden in a ⋯ menu:\n- `ui5Test.screen()` – route, open dialogs, message toasts, buttons on screen.\n- `ui5Test.buttons()` – every button: id suffix, text, visible, on screen. `ui5Test.find(\"text or id part\")` – any control.\n- `ui5Test.press(\"Import CSV\")` or `ui5Test.press(\"ImportCsvButton\")` – presses a button by exact text or id suffix.\n- `ui5Test.openRow(\"P-100\")` – opens the table row containing the text (goes to its object page).\n- `getRows(\"Products\")` – data after an action; `andrutDescribe()` – route and row counts.\n\nRules that save steps:\n- Typical test of an action: `ui5Test.openRow(\"…\")` → wait for the page (`interact_world` `[{\"waitFor\":\".sapUxAPObjectPageLayout\"}]`) → `ui5Test.press(\"…\")` → wait → `ui5Test.screen()` and `getRows(...)`.\n- Do not use `sap.ui.getCore().byId`, `sap.ui.getCore().mElements`, `sap.ui.core.Element.registry` – they do not exist in current SAPUI5. Use `ui5Test`.\n- `fetch()` to the service URL fails – MockServer answers only `XMLHttpRequest`. Read data with `getRows`.\n- Do not click table column headers (it opens a menu that covers the table) and do not tap rows by coordinates – use `ui5Test.openRow`. UI5 ids contain `::` and `.`; an `interact_world` click needs `[id$='suffix']`, and elements in ⋯ menus are not in the DOM – use `ui5Test.press`.\n- The template sets `window.andrutLoading = true` in `index.html` and clears it when the first page is drawn (`ready()` in `start.js`), so `check_world` waits for the app. Keep both. If `check_world` says the world \"still reports loading\", the start failed or hangs – read the console.\n- In `interact_world` prefer `{\"waitFor\":\".sapMListTbl\"}` or `{\"waitFor\":{\"text\":\"…\"}}` to a fixed `wait`. `run_js` waits for a Promise, so `(async () => { … })()` returns its result directly.\n\n## Checking\n- Start takes 3 s or more (longer on the first run). Wait at least 5 s after a change, then read the console and take a screenshot.\n- Console: `404 … library.css` / \"ORB\" → wrong UI5 version in the URL. `failed to load … demo/fe/…` → missing or misnamed file. Empty table with no error → entity set name differs between manifest, metadata and mock file, or the mock JSON is invalid. Empty child table → parent key missing in the child rows or a wrong `ReferentialConstraint`. Column or field missing → wrong `Path` or wrong `Target` namespace in annotations.\n- `window.andrutDescribe()` reports the route and the number of rows per entity set.\n- Edit/Delete and own header actions sit in the ⋯ menu on a phone.\n- Report only what you verified; if you could not take a screenshot, say so.\n\n### Checklist before you say it is done\nGo through every property of every business entity in `metadata.xml` and answer:\n1. Is the document split into a header entity and an item entity with a table on the object page (rule 1)? No item fields in the header?\n2. For each property: is it a code from a known set? Then it has a dictionary entity set, a mock file, `Common.ValueList` (dropdown or dialog) and, except currency / unit, `Common.Text` with a navigation property. List the coded fields and their dictionaries in AGENTS.md.\n3. Does every amount have a currency and every quantity a unit, linked with `sap:unit`, both with a value help?\n4. Open one object in edit mode (`ui5Test.press(\"Edit\")`, then `ui5Test.screen()` or a screenshot): coded fields show the help icon or a dropdown arrow, not a plain input. Open a value help once and check that it lists rows.\n5. Do the list and the object page show names (\"Nordtech (S-01)\"), not bare codes?", "files": {"extras/ListReportExt.controller.js": "// Controller extension of the list report: handler of the custom toolbar action \"Import CSV\"\n// (declared in manifest.json → sap.ui5/extends/extensions/sap.ui.controllerExtensions).\nsap.ui.define([\"sap/m/MessageToast\", \"sap/m/MessageBox\"], function (MessageToast, MessageBox) {\n  \"use strict\";\n  var SET = \"Products\";\n  // CSV columns = property names in the first line; separator , or ; ; quotes \"…\" with \"\" inside.\n  function parseCsv(text) {\n    var sep = (text.split(\"\\n\")[0].match(/;/g) || []).length > (text.split(\"\\n\")[0].match(/,/g) || []).length ? \";\" : \",\";\n    var rows = [], row = [], cell = \"\", quoted = false;\n    for (var i = 0; i < text.length; i++) {\n      var c = text[i];\n      if (quoted) {\n        if (c === '\"' && text[i + 1] === '\"') { cell += '\"'; i++; } else if (c === '\"') quoted = false; else cell += c;\n      } else if (c === '\"') quoted = true;\n      else if (c === sep) { row.push(cell); cell = \"\"; }\n      else if (c === \"\\n\" || c === \"\\r\") {\n        if (c === \"\\r\" && text[i + 1] === \"\\n\") i++;\n        row.push(cell); cell = \"\"; if (row.some(function (x) { return x.trim() !== \"\"; })) rows.push(row); row = [];\n      } else cell += c;\n    }\n    row.push(cell); if (row.some(function (x) { return x.trim() !== \"\"; })) rows.push(row);\n    return rows;\n  }\n  // Text from the CSV -> value in the format of the mock data, by the Edm type from metadata.xml.\n  function convert(value, type) {\n    var v = value.trim();\n    if (v === \"\") return null;\n    if (type === \"Edm.Decimal\") return String(Number(v.replace(\",\", \".\")));\n    if (/^Edm\\.(Int16|Int32|Byte|SByte|Double|Single)$/.test(type)) return Number(v.replace(\",\", \".\"));\n    if (type === \"Edm.Boolean\") return /^(true|1|x|yes)$/i.test(v);\n    if (type === \"Edm.DateTime\") return \"/Date(\" + new Date(v).getTime() + \")/\";\n    return v;\n  }\n  // The import itself, separate from the file picker so it can be tested with run_js:\n  // importCsvText(\"Company;Name\\n1000;Alpha\") -> number of imported rows.\n  function importCsvText(text) {\n    var lines = parseCsv(String(text).replace(/^\\uFEFF/, \"\"));\n    var head = (lines.shift() || []).map(function (h) { return h.trim(); });\n    var types = window.entitySetInfo(SET).types;\n    var unknown = head.filter(function (h) { return !(h in types); });\n    if (unknown.length) throw new Error(\"Unknown columns: \" + unknown.join(\", \") + \". Expected: \" + Object.keys(types).join(\", \"));\n    var rows = lines.map(function (cells) {\n      var r = {}; head.forEach(function (h, i) { r[h] = convert(cells[i] || \"\", types[h]); }); return r;\n    });\n    window.importRows(SET, rows, false);\n    return rows.length;\n  }\n  window.importCsvText = importCsvText;\n\n  return {\n    onImportCsv: function () {\n      var that = this, input = document.createElement(\"input\");\n      input.type = \"file\"; input.accept = \".csv,text/csv,text/plain\";\n      input.onchange = function () {\n        var file = input.files[0]; if (!file) return;\n        var reader = new FileReader();\n        reader.onload = function () {\n          try {\n            var count = importCsvText(reader.result);\n            that.extensionAPI.refreshTable();\n            MessageToast.show(\"Imported \" + count + \" rows\");\n            try { if (window.andrut) andrut.log(\"imported CSV: \" + file.name + \", \" + count + \" rows\"); } catch (e) {}\n          } catch (e) { MessageBox.error(\"Import failed: \" + e.message); }\n        };\n        reader.readAsText(file);\n      };\n      input.click();\n    }\n  };\n});\n", "extras/ObjectPageExt.controller.js": "// Controller extension of the object page: handler of the custom action \"Restock\"\n// (manifest.json → sap.ui.controllerExtensions → …ObjectPage.view.Details → <EntitySet> → Header → Actions).\nsap.ui.define([\"sap/m/MessageToast\"], function (MessageToast) {\n  \"use strict\";\n  return {\n    onRestock: function () {\n      var ctx = this.getView().getBindingContext();           // the opened object\n      var row = Object.assign({}, ctx.getObject()); delete row.__metadata;  // dates are Date objects here – importRows converts them\n      row.Stock = (row.Stock || 0) + 10; row.StockCriticality = 3;\n      window.importRows(\"Products\", [row], false);             // write the change to the mock data\n      this.extensionAPI.refresh();                             // re-read the page\n      MessageToast.show(\"Stock of \" + row.Name + \" is now \" + row.Stock);\n    }\n  };\n});\n", "extras/sample.csv": "ProductID;Name;Category;Supplier;Price;Currency;Stock;StockCriticality;Description\nZ-1;\"Dock \"\"Pro\"\" 12\";ACC;S-04;129,90;EUR;15;3;\"Imported; with semicolon\"\nP-100;Laptop Kestrel 14 v2;COMP;S-01;4199;EUR;1;2;\n", "template/index.html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Fiori Elements app<\/title>\n<style>html, body { margin: 0; height: 100dvh; } #loading { font: 15px system-ui, sans-serif; padding: 24px; color: #556; }<\/style>\n<script>window.andrutLoading = true; // check_world waits until the app clears it<\/script>\n<script id=\"sap-ui-bootstrap\"\n  src=\"https://ui5.sap.com/1.148/resources/sap-ui-core.js\"\n  data-sap-ui-theme=\"sap_horizon\"\n  data-sap-ui-language=\"en\"\n  data-sap-ui-compat-version=\"edge\"\n  data-sap-ui-async=\"true\"\n  data-sap-ui-frame-options=\"allow\"\n  data-sap-ui-log-level=\"fatal\"\n  data-sap-ui-xx-component-preload=\"off\"\n  data-sap-ui-flexibility-services='[{\"connector\": \"SessionStorageConnector\"}]'\n  data-sap-ui-on-init=\"module:demo/fe/start\"\n  data-sap-ui-resource-roots='{\"demo\": \"./\"}'><\/script>\n<\/head>\n<body class=\"sapUiBody\">\n<div id=\"loading\">Loading SAPUI5 and Fiori Elements… (the first start can take several seconds)<\/div>\n<div id=\"content\" style=\"height:100%\"><\/div>\n<\/body>\n<\/html>\n", "template/fe/Component.js": "sap.ui.define([\"sap/suite/ui/generic/template/lib/AppComponent\"], function (AppComponent) {\n  \"use strict\";\n  return AppComponent.extend(\"demo.fe.Component\", { metadata: { manifest: \"json\" } });\n});\n", "template/fe/manifest.json": "{\n  \"_version\": \"1.42.0\",\n  \"sap.app\": {\n    \"id\": \"demo.fe\",\n    \"type\": \"application\",\n    \"title\": \"Products\",\n    \"applicationVersion\": {\n      \"version\": \"1.0.0\"\n    },\n    \"dataSources\": {\n      \"mainService\": {\n        \"uri\": \"/sap/opu/odata/sap/ZDEMO_PRODUCTS_SRV/\",\n        \"type\": \"OData\",\n        \"settings\": {\n          \"odataVersion\": \"2.0\",\n          \"annotations\": [\n            \"localAnnotations\"\n     \"dataLoadSettings\": {\n              \"loadDataOnAppLaunch\": \"always\"\n            }\n          }\n        },\n        \"pages\": {\n          \"ObjectPage|Products\": {\n            \"entitySet\": \"Products\",\n            \"component\": {\n              \"name\": \"sap.suite.ui.generic.template.ObjectPage\"\n            },\n            \"pages\": {\n              \"ObjectPage|to_Orders\": {\n                \"navigationProperty\": \"to_Orders\",\n                \"entitySet\": \"Orders\",\n                \"component\": {\n                  \"name\": \"sap.suite.ui.generic.template.ObjectPage\"\n                }\n              }\n            }\n          }\n        }\n      }\n    }\n  }\n}", "template/fe/start.js": "// Start of the Fiori Elements V2 app in Andrut (no backend, no Fiori Launchpad):\n// 1. MockServer answers the OData V2 requests in the browser (metadata.xml + mockdata/<EntitySet>.json),\n// 2. a stub replaces the launchpad's ShellUIService (without it Fiori Elements throws on start),\n// 3. the component demo.fe (manifest.json) is created and placed on the page.\n// Rows of every entity set are kept between visits (andrut.setData under \"fe_<EntitySet>\").\nsap.ui.define([\n  \"sap/ui/core/util/MockServer\", \"sap/ui/core/ComponentContainer\",\n  \"sap/ui/core/service/Service\", \"sap/ui/core/service/ServiceFactory\", \"sap/ui/core/service/ServiceFactoryRegistry\",\n  \"sap/ui/core/ElementRegistry\"\n], function (MockServer, ComponentContainer, Service, ServiceFactory, ServiceFactoryRegistry, ElementRegistry) {\n  \"use strict\";\n  // Must be the same as sap.app/dataSources/mainService/uri in manifest.json.\n  var SERVICE_URI = \"/sap/opu/odata/sap/ZDEMO_PRODUCTS_SRV/\";\n  var hasAndrut = typeof window.andrut !== \"undefined\";\n  var base = sap.ui.require.toUrl(\"demo/fe/localService\");\n  // sets: entity set name -> { props: property names, types: property -> Edm type, keys: key names, navs: navigation property\n  // names, type: \"Namespace.EntityType\" }\n  var server = null, sets = {};\n\n  var ShellStub = Service.extend(\"demo.fe.ShellUIServiceStub\", {\n    setTitle: function (t) { document.title = t; }, getTitle: function () { return document.title; },\n    setHierarchy: function () {}, setRelatedApps: function () {}, setBackNavigation: function () {},\n    attachEvent: function () {}, detachEvent: function () {}\n  });\n  ServiceFactoryRegistry.register(\"sap.ushell.ui5service.ShellUIService\", new ServiceFactory(ShellStub));\n\n  // The start is over when the first page is drawn: Andrut's check_world waits for this signal (set in index.html).\n  function ready() {\n    var t0 = Date.now(), timer = setInterval(function () {\n      if (document.querySelector(\".sapMListTbl, .sapUxAPObjectPageLayout\") || Date.now() - t0 > 15000) { clearInterval(timer); window.andrutLoading = false; }\n    }, 200);\n  }\n  function fail(e) {\n    window.andrutLoading = false;\n    document.getElementById(\"loading\").textContent = \"Fiori Elements failed to start: \" + e.message;\n    console.error(\"Fiori Elements: \" + (e.stack || e.message));\n  }\n  function readSets(xml) {\n    var doc = new DOMParser().parseFromString(xml, \"application/xml\"), types = {};\n    var ns = doc.getElementsByTagName(\"Schema\")[0].getAttribute(\"Namespace\");\n    Array.prototype.forEach.call(doc.getElementsByTagName(\"EntityType\"), function (t) {\n      var info = { props: [], types: {}, keys: [], navs: [], type: ns + \".\" + t.getAttribute(\"Name\") };\n      Array.prototype.forEach.call(t.getElementsByTagName(\"NavigationProperty\"), function (n) { info.navs.push(n.getAttribute(\"Name\")); });\n      Array.prototype.forEach.call(t.getElementsByTagName(\"Property\"), function (p) {\n        info.props.push(p.getAttribute(\"Name\")); info.types[p.getAttribute(\"Name\")] = p.getAttribute(\"Type\");\n      });\n      Array.prototype.forEach.call(t.getElementsByTagName(\"PropertyRef\"), function (k) {\n        if (k.parentNode.nodeName === \"Key\") info.keys.push(k.getAttribute(\"Name\"));\n      });\n      types[t.getAttribute(\"Name\")] = info;\n    });\n    Array.prototype.forEach.call(doc.getElementsByTagName(\"EntitySet\"), function (s) {\n      sets[s.getAttribute(\"Name\")] = types[s.getAttribute(\"EntityType\").split(\".\").pop()];\n    });\n  }\n  function keyUri(set, row) {\n    var info = sets[set];\n    var parts = info.keys.map(function (k) {\n      var v = info.types[k] === \"Edm.String\" ? \"'\" + encodeURIComponent(String(row[k]).replace(/'/g, \"''\")) + \"'\" : row[k];\n      return info.keys.length > 1 ? k + \"=\" + v : v;\n    });\n    return SERVICE_URI + set + \"(\" + parts.join(\",\") + \")\";\n  }\n  // MockServer needs complete rows: it answers 404 for a whole table when one row lacks a selected property\n  // (a row created in the app has no empty fields), and rows without __metadata (imported ones) are not shown.\n  // Values in the format of the mock data. getBindingContext().getObject() gives dates as Date objects (saved as ISO text\n  // \"2025-01-01T00:00:00.000Z\") and navigation properties as {\"__ref\": \"…\"} – MockServer then fails on the whole table\n  // (\"Fake XHR onreadystatechange handler threw exception\") and the list stays empty. Fixed here for every row.\n  function fixValues(set, row) {\n    var info = sets[set], changed = false;\n    Object.keys(row).forEach(function (k) {\n      var v = row[k], type = info.types[k];\n      if (k === \"__metadata\") return;\n      if (!type) { // navigation property (set again below as MockServer's own {__deferred}) or unknown object: dropped\n        if (v && typeof v === \"object\" && !v.__deferred) { delete row[k]; changed = true; }\n        return;\n      }\n      if (/^Edm\\.DateTime(Offset)?$/.test(type) && v !== null && v !== undefined) {\n        var ms = v instanceof Date ? v.getTime() : typeof v === \"string\" && !/^\\/Date\\(/.test(v) ? Date.parse(v) : typeof v === \"number\" ? v : NaN;\n        if (!isNaN(ms)) { row[k] = \"/Date(\" + ms + \")/\"; changed = true; }\n      } else if (type === \"Edm.Decimal\" && typeof v === \"number\") { row[k] = String(v); changed = true; }\n    });\n    // MockServer fails on the whole table when a row lacks a navigation property ($expand of texts), so every row has them\n    info.navs.forEach(function (n) {\n      if (!row[n]) { row[n] = { __deferred: { uri: keyUri(set, row) + \"/\" + n } }; changed = true; }\n    });\n    return changed;\n  }\n  function normalize() {\n    Object.keys(sets).forEach(function (set) {\n      var rows = server.getEntitySetData(set), changed = false;\n      rows.forEach(function (row) {\n        if (fixValues(set, row)) changed = true;\n        sets[set].props.forEach(function (prop) { if (!(prop in row)) { row[prop] = null; changed = true; } });\n        if (!row.__metadata) { var uri = keyUri(set, row); row.__metadata = { id: uri, uri: uri, type: sets[set].type }; changed = true; }\n      });\n      if (changed) server.setEntitySetData(set, rows);\n    });\n  }\n  function saveAll() {\n    normalize();\n    if (!hasAndrut) return;\n    Object.keys(sets).forEach(function (set) {\n      try { andrut.setData(\"fe_\" + set, JSON.stringify(server.getEntitySetData(set))); } catch (e) {}\n    });\n  }\n\n  fetch(base + \"/metadata.xml\").then(function (r) { return r.text(); }).then(function (xml) {\n    readSets(xml);\n    server = new MockServer({ rootUri: SERVICE_URI });\n    MockServer.config({ autoRespond: true, autoRespondAfter: 150 });\n    server.simulate(base + \"/metadata.xml\", { sMockdataBaseUrl: base + \"/mockdata\", bGenerateMissingMockData: true });\n    server.start();\n    Object.keys(sets).forEach(function (set) {\n      try { var raw = hasAndrut ? andrut.getData(\"fe_\" + set) : null; if (raw) server.setEntitySetData(set, JSON.parse(raw)); } catch (e) {}\n    });\n    normalize();\n    // Save after any change. No entity set filter: a child row created through a navigation property\n    // (Products('1')/to_Orders) is reported under the parent set. setTimeout: the \"after\" event fires\n    // before the mock data is updated.\n    [\"POST\", \"PUT\", \"MERGE\", \"PATCH\", \"DELETE\"].forEach(function (method) {\n      server.attachAfter(method, function () { setTimeout(saveAll, 0); });\n    });\n    sap.ui.require([\"sap/ui/core/Component\"], function (Component) {\n      Component.create({ name: \"demo.fe\", manifest: true }).then(function (comp) {\n        document.getElementById(\"loading\").remove();\n        new ComponentContainer({ component: comp, height: \"100%\" }).placeAt(\"content\");\n        ready();\n        console.log(\"Fiori Elements ready (SAPUI5 \" + sap.ui.version + \")\");\n      }).catch(fail);\n    });\n  }).catch(fail);\n\n  // Import rows from own code (CSV import, sync…): importRows(\"Products\", [{ProductID: \"X-1\", Name: \"…\"}], false).\n  // Rows with an existing key replace the old row; replaceAll = true drops all old rows first. Values should have the\n  // types of the mock data (Edm.Decimal as string \"12.50\", Edm.Int32 as number, Edm.DateTime as \"/Date(ms)/\"); Date objects,\n  // ISO dates, numbers in Decimal fields and navigation values from getObject() are converted / dropped (fixValues).\n  // Then refresh the open table: this.extensionAPI.refreshTable() in a controller extension, or location.reload().\n  window.importRows = function (set, rows, replaceAll) {\n    if (!sets[set]) throw new Error(\"Unknown entity set \" + set + \". Known: \" + Object.keys(sets).join(\", \"));\n    var keyOf = function (r) { return sets[set].keys.map(function (k) { return String(r[k]); }).join(\"|\"); };\n    var byKey = {}, out = [];\n    (replaceAll ? [] : server.getEntitySetData(set)).concat(rows).forEach(function (r) {\n      var k = keyOf(r), copy = Object.assign({}, r); delete copy.__metadata; fixValues(set, copy);\n      if (k in byKey) out[byKey[k]] = copy; else { byKey[k] = out.length; out.push(copy); }\n    });\n    server.setEntitySetData(set, out);\n    saveAll();\n    return out.length;\n  };\n  // Property types and keys of an entity set (from metadata.xml), e.g. for converting imported values.\n  window.entitySetInfo = function (set) { return sets[set]; };\n  // Current rows of an entity set (copy without __metadata) – for checks with run_js.\n  window.getRows = function (set) {\n    return server.getEntitySetData(set).map(function (r) { var c = Object.assign({}, r); delete c.__metadata; return c; });\n  };\n\n  // ---- Helpers for testing with run_js (they work on UI5 controls, so also on buttons hidden in an overflow menu) ----\n  function label(c) {\n    try { return (c.getText && c.getText()) || (c.getTitle && c.getTitle()) || (c.getTooltip_AsString && c.getTooltip_AsString()) || \"\"; }\n    catch (e) { return \"\"; } // some controls throw outside their container\n  }\n  function visible(c) { try { return c.getVisible ? c.getVisible() : true; } catch (e) { return false; } }\n  function unique(list) { return list.filter(function (x, i) { return x && list.indexOf(x) === i; }); }\n  function controls(test) { var out = []; ElementRegistry.forEach(function (c) { if (test(c)) out.push(c); }); return out; }\n  function matches(c, what) { return c.getId().slice(-what.length) === what || label(c) === what; }\n  window.ui5Test = {\n    // ui5Test.buttons() -> every button: \"id suffix | text | visible | on screen\"\n    buttons: function () {\n      return controls(function (c) { return typeof c.firePress === \"function\" && c.isA(\"sap.m.Button\"); }).map(function (c) {\n        return c.getId().split(\"--\").pop() + \" | \" + label(c) + \" | visible=\" + c.getVisible() + \" | onScreen=\" + !!(c.getDomRef() && c.getDomRef().offsetParent);\n      });\n    },\n    // ui5Test.find(\"Process\") -> controls whose id contains the text or whose label equals it\n    find: function (what) {\n      return controls(function (c) { return c.getId().indexOf(what) >= 0 || label /** Small DOM builder: h('div', {class:'x', onclick: fn}, child, 'text') */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected') e[k] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}

const DB = {

        rq.onupgradeneeded = () => rq.result.createObjectStore('projects', { keyPath: 'id' });
        rq.onsuccess = () => { this.db = rq.result; res(true); };

      } catch (e) { this.mem = new Map(); res(false); }

    });

// andrut-theme.css of the "Clean" theme (same variables and classes as in the Android app, system font)

  return `/* Andrut – theme "Clean" (${dark ? 'dark' : 'light'}) */

--primary:${c.primary};--on-primary:${c.on};--secondary:${c.secondary};--text:${c.text};--muted:${c.muted};--border:${c.border};

*{box-sizing:border-box}

h1{font-size:2rem;font-weight:800} h2{font-size:1.5rem;font-weight:700} h3{font-size:1.2rem;font-weight:700}
a{color:var(--primary)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:var(--border-w) solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}

// ===== Andrut Lite: OpenRouter and Claude (Anthropic) straight from the browser =====
const PROVIDERS = {
  openrouter: { label: 'OpenRouter', keyField: 'orKey', keyHint: 'sk-or-…', keyUrl: 'openrouter.ai/keys', defaultModel: 'openrouter/auto' },
  anthropic: { label: 'Claude (Anthropic)', keyField: 'anKey', keyHint: 'sk-ant-…', keyUrl: 'console.anthropic.com', defaultModel: 'claude-sonnet-5-5' },

/** Model list of a provider: [{ id, name, ctx, free }] – only models that can call tools. */

      .sort((a, b) => a.name.localeCompare(b.name));

// ----- cost of an answer (prices of the public OpenRouter list; OpenRouter itself reports the real cost) -----
async function loadPrices() {
  let c = null; try { c = JSON.parse(localStorage.getItem('andrut-lite:prices')); } catch (e) {}
  if (c && c.map && Date.now() - c.t < 864e5) return c.map;
  try {
    const r = await fetch(OR_URL + '/models', { signal: AbortSignal.timeout(5000) }); if (!r.ok) throw new Error('HTTP ' + r.status);
    const map = {}; for (const m of (await r.json()).data) if (m.pricing) map[m.id] = { in: +m.pricing.prompt || 0, out: +m.pricing.completion || 0,
      read: m.pricing.input_cache_read != null ? +m.pricing.input_cache_read : null, write: m.pricing.input_cache_write != null ? +m.pricing.input_cache_write : null };
    try { localStorage.setItem('andrut-lite:prices', JSON.stringify({ t: Date.now(), map })); } catch (e) {}
    return map;
  } catch (e) { return c && c.map || null; }
}
/** "claude-3-7-sonnet-20250219" and "anthropic/claude-3.7-sonnet" name the same model: compare the sorted name parts. */
const claudeKey = id => String(id).toLowerCase().replace(/^anthropic\//, '').replace(/:.*$/, '').replace(/-\d{8}$/, '').split(/[-.]/).filter(t => t && t !== 'latest').sort().join('-');

/** Adds cost, saved (what the cache saved, negative when only written), noPrice, provider and model to the usage of one answer. */
async function priceUsage(provider, model, usage, settings) {
  const u = Object.assign({}, usage, { provider, model });
  try {
    const rd = u.cacheRead || 0, wr = u.cacheWrite || 0;
    const p = provider === 'anthropic' || typeof u.cost !== 'number' || rd || wr ? priceOf(provider, model, await loadPrices()) : null;
    if (provider === 'openrouter') {
      if (typeof u.cost !== 'number') { if (p) u.cost = u.input * p.in + u.output * p.out; else u.noPrice = true; }
      if (p && (rd || wr)) { u.saved = rd * (p.in - (p.read != null ? p.read : p.in * 0.1)) - wr * ((p.write != null ? p.write : p.in * 1.25) - p.in); u.savedApprox = true; }

// ===== Andrut Lite: the world frame, the tools of the model and the work loop =====
const App = { settings: Settings.load(), project: null, console: [], busy: false, abort: null, pendingAsk: null, dirty: false, frame: null, loads: 0, ui: {} };
/** Limits from the settings (see LIMITS in core.js): waits in ms, result lengths in characters. */

/** Cuts a tool result to a limit with a note, so the model knows it does not see everything. */

let saveTimer = null;

function addConsole(level, text) {
  App.console.push({ level, text: String(text).slice(0, 2000), load: App.loads, t: Date.now() });
  if (App.console.length > 500) App.console.splice(0, App.console.length - 500);
  App.ui.onConsole && App.ui.onConsole();
}
// what the world frame may ask for (see shim.js)
window.__andrutLite = { frame: {
  files: () => App.project ? App.project.files : {},
  modules: () => App.project ? worldModules(App.project.files) : {},
  getData: k => App.project && k in App.project.data ? App.project.data[k] : null,
  setData: (k, v) => { if (App.project) { App.project.data[k] = v; saveSoon(); } },
  removeData: k => { if (App.project) { delete App.project.data[k]; saveSoon(); } },
  log: addConsole,

const darkMode = () => matchMedia('(prefers-color-scheme: dark)').matches;

async function execTool(name, a) {

    case 'read_file': if (!(path in F)) return fail('No file ' + path + '. Files: ' + (Object.keys(F).join(', ') || 'none')); return ok(typeof F[path] === 'string' ? cutEnd(F[path], limit('readFileChars')) : '(binary file, ' + fileSize(F[path]) + ' B)');

      if (n === 0) return fail('old_text not found in ' + path + ' – copy the fragment exactly (read_file) including spaces and line breaks.');
      if (n > 1) return fail('old_text occurs ' + n + ' times in ' + path + ' – make it longer so that it is unique.');
      F[path] = F[path].replace(a.old_text, () => a.new_text || ''); changed(); return ok('Changed ' + path);
    }
    case 'delete_file': if (!(path in F)) return fail('No file ' + path); delete F[path]; changed(); return ok('Deleted ' + path);

      const out = [];
      if (errs.length) out.push('CONSOLE ERRORS (' + errs.length + '):\n' + errs.slice(0, 15).map(e => '- ' + e.text).join('\n'));

/** ask_user: shows a card in the chat and waits for the user's choice (or own words). Resolves with the answer, or null when the work is stopped. */
function askUser(call, a) {
  const options = (Array.isArray(a.options) ? a.options : []).map(o => typeof o === 'string' ? { label: o } : o).filter(o => o && o.label).slice(0, 4)
    .map(o => ({ label: String(o.label), description: o.description ? String(o.description) : '' }));
  if (!a.question || options.length < 2) return Promise.resolve({ content: 'ask_user needs a question and 2-4 options (each with a label)', isError: true });
  call.ask = { question: String(a.question), options };
  return new Promise(resolve => {
    const signal = App.abort.signal;
    const done = answer => { signal.removeEventListener('abort', onAbort); App.pendingAsk = null; resolve(answer == null ? { content: 'Stopped by the user', isError: true } : { content: answer }); App.ui.onChat && App.ui.onChat(); };
    const onAbort = () => done(null);
    App.pendingAsk = { callId: call.id, answer: text => { text = String(text || '').trim(); if (text) done(text); } };
    signal.addEventListener('abort', onAbort);
