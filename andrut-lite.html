const LIMIT_TEXT = n => '[App instruction] You have used up the limit of ' + n + ' steps in this answer – the app stopped the work. ' +
  'Do NOT use tools now. Briefly tell the user: what you did, what works (and how you checked it), what does not work and what is left to do. ' +
  'The user can tap "Kontynuuj" (Continue) to let you keep working.';
const CONTINUE_TEXT = 'Kontynuuj pracę od miejsca, w którym przerwałeś.';
/** Sleeps, but ends at once when the work is stopped. */
const sleepAbortable = (ms, signal) => new Promise(res => { const t = setTimeout(res, ms); signal.addEventListener('abort', () => { clearTimeout(t); res(); }, { once: true }); });

/** Sends the user's message and lets the model work with tools until it answers without calling one. */
async function runAgent(text) {
  const p = App.project; if (App.busy) return;
  App.busy = true; App.abort = new AbortController(); App.ui.onBusy && App.ui.onBusy();
  if (text != null) p.chat.push({ id: uid(), role: 'user', text, ts: Date.now() });
  App.ui.onChat && App.ui.onChat();
  const { provider, model } = modelOf(p), maxSteps = limit('maxSteps');
  /** One model answer with automatic repeats after a network / provider failure (as many as in the settings). */
  async function ask(live, maxTokens) {
    for (let attempt = 0; ; attempt++) {
      try {
        return await callModel({ provider, model, settings: App.settings, system: systemPrompt(p), chat: p.chat.slice(0, -1), tools: toolDefs(), signal: App.abort.signal, effort: effortOf(p), maxTokens,
          onReasoning: t => { live.reasoning = t; if (!live.progress || live.progress.thinking) live.progress = { thinking: true }; App.ui.onLive && App.ui.onLive(live); },
          onText: t => { live.text = t; live.progress = { writing: true }; App.ui.onLive && App.ui.onLive(live); },
          onProgress: pr => { live.progress = pr; App.ui.onLive && App.ui.onLive(live); } });
      } catch (e) {
        if (e && e.name === 'AbortError' || !transient(e) || attempt >= limit('netRetries')) throw e;
        live.text = ''; delete live.reasoning; live.progress = { retry: attempt + 1 }; App.ui.onLive && App.ui.onLive(live);
        await sleepAbortable(2000, App.abort.signal);
        if (App.abort.signal.aborted) throw Object.assign(new Error('Stopped'), { name: 'AbortError' });
      }
    }
  }
  try {
    for (let step = 0; ; step++) {
      const summary = step === maxSteps;
      if (summary) p.chat.push({ id: uid(), role: 'user', text: LIMIT_TEXT(maxSteps), hidden: true, check: 'limit', ts: Date.now() });
      const live = { id: uid(), role: 'assistant', text: '', toolCalls: [], ts: Date.now(), live: true };
      p.chat.push(live); App.ui.onChat && App.ui.onChat();
      const setMax = limit('maxTokens');
      let reply, max = setMax || autoMaxTokens(provider);
      try {
        reply = await ask(live, max);
        // cut off by the length limit in the middle of a tool call (e.g. a big write_file): with Auto, once more with a double limit
        if (!setMax && isTruncated(reply.stop) && reply.toolCalls.some(c => !completeArgs(c.args))) {
          max *= 2; live.text = ''; live.progress = { longer: max }; App.ui.onLive && App.ui.onLive(live);
          reply = await ask(live, max);
        }
      } catch (e) { p.chat.pop(); throw e; }
      if (reply.usage) reply.usage = await priceUsage(provider, model, reply.usage, App.settings);
      // after the step limit: only the summary counts – calls of tools are dropped (they would stay without results)
      if (summary) reply.toolCalls = [];
      live.text = reply.text; live.toolCalls = reply.toolCalls; live.usage = reply.usage; delete live.live; delete live.progress;
      // the thinking stays in the interface only (it is never sent back): the text capped, the tokens exact when the provider says them
      const exact = reply.usage && reply.usage.reasoning || 0;
      if (reply.reasoning || exact) { live.reasoning = reply.reasoning.length > REASONING_KEEP ? reply.reasoning.slice(0, REASONING_KEEP) + '\n…' : reply.reasoning;
        live.reasoningTokens = exact || Math.round(reply.reasoning.length / 4); live.reasoningExact = !!exact; } else delete live.reasoning;
      if (summary) { live.limit = true; if (!live.text) live.text = '(Model nie napisał podsumowania – wykorzystał limit ' + maxSteps + ' kroków.)'; saveSoon(); break; }
      if (!reply.text && !reply.toolCalls.length) { p.chat.pop(); p.chat.push({ id: uid(), role: 'assistant', text: '', error: 'Model zwrócił pustą odpowiedź' + (reply.stop ? ' (' + reply.stop + ')' : '') + '.', retry: true, ts: Date.now() }); break; }
      saveSoon(); App.ui.onChat && App.ui.onChat();
      if (!reply.toolCalls.length) break;
      const cut = isTruncated(reply.stop);
      const results = [];
      for (const c of reply.toolCalls) {
        if (App.abort.signal.aborted) { results.push({ callId: c.id, name: c.name, content: 'Stopped by the user', isError: true }); continue; }
        let r;
        if (cut && !completeArgs(c.args)) r = { content: 'Your answer was cut off by the length limit (' + max + ' tokens) while you were writing the arguments of ' + c.name +
          ' – nothing was done. Write big files in parts: write_file with the first part (about 8000 characters), then append_file for the rest.', isError: true };
        else try { r = c.name === 'ask_user' ? await askUser(c, parseArgs(c.args)) : await execTool(c.name, parseArgs(c.args)); } catch (e) { r = { content: 'Tool error: ' + (e && e.message || e), isError: true }; }
        results.push({ callId: c.id, name: c.name, content: String(r.content), isError: !!r.isError });
      }
      p.chat.push({ id: uid(), role: 'tool', toolResults: results, ts: Date.now() });
      saveSoon(); App.ui.onChat && App.ui.onChat();
      if (App.abort.signal.aborted) break;
    }
  } catch (e) {
    if (!(e && e.name === 'AbortError')) p.chat.push({ id: uid(), role: 'assistant', text: '', error: String(e && e.message || e), retry: true,
      detail: ['Model: ' + model + ' (' + PROVIDERS[provider].label + ')', e && e.detail || ''].filter(Boolean).join('\n'), ts: Date.now() });
  }
  if (App.dirty) await reloadWorld();
  App.busy = false; App.abort = null;
  await saveNow();
  App.ui.onBusy && App.ui.onBusy(); App.ui.onChat && App.ui.onChat();
}

// ----- markdown (small subset) -----
function md(text) {
  const e = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = s => e(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');

  const flush = () => { if (para.length) { out.push('<p>' + para.join('<br>') + '</p>'); para = []; } if (list) { out.push('</' + list + '>'); list = null; } };
  const parts = text.split(/```/);
  parts.forEach((part, i) => {
    if (i % 2) { flush(); out.push('<pre><code>' + e(part.replace(/^[a-z0-9]*\n/i, '')) + '</code></pre>'); return; }
    for (const line of part.split('\n')) {
      let m;
      if ((m = line.match(/^#{1,6}\s+(.*)/))) { flush(); out.push('<h4>' + inline(m[1]) + '</h4>'); }
      else if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { if (para.length) { out.push('<p>' + para.join('<br>') + '</p>'); para = []; } if (list !== 'ul') { if (list) out.push('</' + list + '>'); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inline(m[1]) + '</li>'); }
      else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (para.length) { out.push('<p>' + para.join('<br>') + '</p>'); para = []; } if (list !== 'ol') { if (list) out.push('</' + list + '>'); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inline(m[1]) + '</li>'); }
      else if (!line.trim()) flush();
      else { if (list) { out.push('</' + list + '>'); list = null; } para.push(inline(line)); }
    }
  });
  flush();
  return out.join('');
}

    if (b && b.dataset.text !== m.text) { b.innerHTML = md(m.text); b.dataset.text = m.text; }
    st.firstChild.textContent = liveStatus(m);
    if (atBottom) msgs.scrollTop = msgs.scrollHeight; };
  App.ui.onBusy = () => { sendBtn.textContent = App.busy ? 'Stop' : 'Wyślij'; sendBtn.classList.toggle('primary', !App.busy); chip.textContent = modelLabel(); };

  // files
  let current = null;
  const flist = h('div', {}), fhead = h('b', {}, ''), editor = h('textarea', { spellcheck: 'false', 'aria-label': 'Treść pliku', oninput: () => { saveFile.disabled = false; } });
  const saveFile = h('button', { class: 'primary', disabled: true, onclick: async () => { if (current == null) return; p.files[current] = editor.value; saveFile.disabled = true; await saveNow(); renderFiles(); reloadWorld(); toast('Zapisano ' + current); } }, 'Zapisz');
  const fview = h('div', { class: 'fview' }, h('div', { class: 'head' }, fhead, saveFile,
    h('button', { onclick: () => current != null && download(current.split('/').pop(), new Blob([fileBytes(p.files[current])])) }, 'Pobierz'),
    h('button', { class: 'danger', onclick: async () => { if (current == null) return; if (await confirmDlg('Usunąć plik?', current, 'Usuń', true)) { delete p.files[current]; current = null; await saveNow(); renderFiles(); reloadWorld(); } } }, 'Usuń')), editor);
  function showFile(path) { current = path; const v = p.files[path]; fhead.textContent = path; const text = typeof v === 'string';
    editor.value = text ? v : '(plik binarny, ' + fmtSize(fileSize(v)) + ')'; editor.readOnly = !text; saveFile.disabled = true; renderFiles(); }
  function renderFiles() {
    const paths = Object.keys(p.files).sort();
    if (current != null && !(current in p.files)) current = null;
    flist.replaceChildren(...paths.map(k => h('button', { class: 'fitem' + (k === current ? ' on' : ''), onclick: () => showFile(k) }, h('span', {}, k), h('span', {}, fmtSize(fileSize(p.files[k]))))));
    if (!paths.length) flist.append(h('div', { class: 'muted small', style: 'padding:10px' }, 'Brak plików'));
    fview.style.display = current == null ? 'none' : '';
    if (current != null && saveFile.disabled && typeof p.files[current] === 'string' && editor.value !== p.files[current]) editor.value = p.files[current];
  }
  App.ui.onFiles = renderFiles;
  const upload = h('input', { type: 'file', multiple: true, hidden: true, onchange: async () => { for (const f of upload.files) p.files[f.name] = fileFromBytes(f.name, new Uint8Array(await f.arrayBuffer())); upload.value = ''; await saveNow(); renderFiles(); reloadWorld(); } });
  const filesView = h('div', { class: 'files' }, h('div', { class: 'flist' }, h('div', { class: 'tools' },
    h('button', { onclick: async () => { const name = h('input', { placeholder: 'np. notatki.md', 'aria-label': 'Nazwa pliku' });
      if (await dialog('Nowy plik', h('div', {}, h('label', {}, 'Ścieżka'), name), [{ label: 'Anuluj', value: false }, { label: 'Utwórz', value: true, primary: true }]) && cleanPath(name.value)) {
        const k = cleanPath(name.value); if (!(k in p.files)) p.files[k] = ''; await saveNow(); showFile(k); } } }, 'Nowy plik'),
    h('button', { onclick: () => upload.click() }, 'Wgraj'), upload), flist), fview);

  // console
  const clog = h('div', { class: 'clog' });
  function renderConsole() { const atBottom = clog.scrollHeight - clog.scrollTop - clog.clientHeight < 60;
    clog.replaceChildren(...App.console.slice(-300).map(e => h('div', { class: e.level }, e.level === 'load' ? '— ' + e.text + ' —' : e.text)));
    if (!App.console.length) clog.append(h('div', { class: 'load' }, 'Konsola jest pusta'));
    if (atBottom) clog.scrollTop = clog.scrollHeight;
    const errs = App.console.filter(e => e.load === App.loads && e.level === 'error').length; tabBtn.console.textContent = 'Konsola' + (errs ? ' (' + errs + ')' : ''); }
  let consoleTimer = null; App.ui.onConsole = () => { clearTimeout(consoleTimer); consoleTimer = setTimeout(renderConsole, 100); };
  const consoleView = h('div', { class: 'console' }, h('div', { class: 'tools' },
    h('button', { onclick: () => reloadWorld() }, 'Odśwież świat'), h('button', { onclick: () => { App.console.length = 0; renderConsole(); } }, 'Wyczyść')), clog);

  // tabs
  const views = { world: h('div', { class: 'view world on' }, frame), files: h('div', { class: 'view' }, filesView), console: h('div', { class: 'view' }, consoleView) };
  const tabBtn = {}; const work = h('div', { class: 'work' });
  const narrowChat = h('button', { class: 'on', onclick: () => side(false) }, 'Czat'), narrowSide = h('button', { onclick: () => side(true) }, 'Podgląd');
  function side(on) { work.classList.toggle('show-side', on); narrowChat.classList.toggle('on', !on); narrowSide.classList.toggle('on', on); }
  function tab(name) { for (const k in views) { views[k].classList.toggle('on', k === name); tabBtn[k].classList.toggle('on', k === name); } if (name === 'files') renderFiles(); if (name === 'console') renderConsole(); }
  for (const [k, label] of [['world', 'Świat'], ['files', 'Pliki'], ['console', 'Konsola']]) tabBtn[k] = h('button', { class: k === 'world' ? 'on' : '', onclick: () => tab(k) }, label);

  const modelLabel = () => { const m = modelOf(p); return m.model; };
  const title = h('div', { class: 'title' }, p.name);
  const projectSettings = async () => { if (App.busy) return toast('Poczekaj, aż model skończy'); if (await projectDialog(p)) { title.textContent = p.name; chip.textContent = modelLabel(); } };
  const chip = h('button', { class: 'chip only-wide', title: 'Model i ustawienia projektu', onclick: projectSettings }, modelLabel());
  const costChip = h('button', { class: 'chip', id: 'costchip', title: 'Koszt sesji – szczegóły', hidden: true, onclick: () => costDialog(p.chat) });
  const showCost = () => { const t = sessionCost(p.chat); costChip.hidden = !t.answers;
    costChip.replaceChildren(h('span', { class: 'only-wide' }, 'Sesja: '), t.priced ? fmtUsd(t.cost) : '–'); };
  work.append(
    h('div', { class: 'pane chat' }, msgs, h('div', { class: 'compose' }, input, sendBtn)),
    h('div', { class: 'pane side' }, h('div', { class: 'tabs' }, tabBtn.world, tabBtn.files, tabBtn.console,
      h('span', { style: 'flex:1' }), h('button', { title: 'Wczytaj świat od nowa', onclick: () => reloadWorld() }, '↻')), h('div', { class: 'views' }, views.world, views.files, views.console)));
  root().replaceChildren(
    h('div', { class: 'bar' }, h('button', { class: 'icon', title: 'Lista projektów', 'aria-label': 'Lista projektów', onclick: async () => { if (App.busy && App.abort) App.abort.abort(); await saveNow(); showHome(); } }, '←'),
      title, costChip, chip, h('div', { class: 'tabs-narrow' }, narrowChat, narrowSide),
      h('button', { class: 'only-wide', title: 'Eksport projektu (.andrut.zip)', onclick: () => download(safeName(p.name) + '.andrut.zip', exportProjectZip(p)) }, 'ZIP'),
      h('button', { class: 'only-wide', title: 'Eksport świata jako jeden plik HTML', onclick: () => exportHtml(p) }, 'HTML'),
      h('button', { class: 'icon', title: 'Ustawienia projektu i eksport', 'aria-label': 'Ustawienia projektu', onclick: projectSettings }, '⚙')),
    work);
  renderChat(); renderFiles(); renderConsole(); showCost();
  msgs.scrollTop = msgs.scrollHeight;
  await reloadWorld();
}

addEventListener('beforeunload', () => { if (App.project) DB.put(App.project); });
DB.open().then(showHome);

</script>
</body>
</html>
